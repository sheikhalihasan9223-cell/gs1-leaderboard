<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<title>GS1 Saudi Arabia — Employee Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --blue:#1a6fd4;--blue2:#0a3d7a;--red:#e3231c;--gold:#f5c842;
  --c-red:#ff4444;--c-red-bg:rgba(255,50,50,0.13);--c-red-border:rgba(255,80,80,0.35);
  --c-yellow:#e6a800;--c-yellow-bg:rgba(255,200,0,0.13);--c-yellow-border:rgba(255,200,0,0.38);
  --c-lgreen:#22c55e;--c-lgreen-bg:rgba(34,197,94,0.11);--c-lgreen-border:rgba(34,197,94,0.32);
  --c-green:#16a34a;--c-green-bg:rgba(22,163,74,0.13);--c-green-border:rgba(22,163,74,0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Rajdhani',sans-serif}

body{background:linear-gradient(160deg,#e8f0fb 0%,#f5f8ff 40%,#ffffff 100%);}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 0% 0%,rgba(0,82,155,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%,rgba(0,82,155,0.05) 0%,transparent 60%);
}

/* ── HEADER ── */
.header{
  position:relative;z-index:10;padding:10px 36px;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(32px) saturate(200%);
  border-bottom:1.5px solid rgba(255,255,255,0.5);
  box-shadow:0 4px 24px rgba(0,20,80,0.1),inset 0 1.5px 0 rgba(255,255,255,0.8);
  display:flex;justify-content:space-between;align-items:center;
}
.header-left{display:flex;align-items:center;gap:18px}
.logo-img{height:62px;object-fit:contain}
.divider{width:1.5px;height:44px;background:linear-gradient(180deg,var(--blue),var(--red));border-radius:2px;opacity:0.3}
.title-block .title{font-size:24px;font-weight:800;color:var(--blue2);letter-spacing:3px}
.title-block .sub{font-size:11px;color:#7a9ab5;letter-spacing:3px;margin-top:2px;text-transform:uppercase}
.hright{display:flex;align-items:center;gap:12px}
.clock{font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:800;color:#0a1a3a;letter-spacing:2px;padding:5px 18px;background:rgba(255,255,255,0.6);backdrop-filter:blur(16px);border-radius:16px;border:1.5px solid rgba(255,255,255,0.7);box-shadow:0 4px 16px rgba(0,20,80,0.1),inset 0 1.5px 0 rgba(255,255,255,0.8)}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:rgba(255,255,255,0.6);backdrop-filter:blur(16px);border:1.5px solid rgba(255,255,255,0.7);border-radius:24px;padding:5px 16px;font-size:13px;color:#5a7a99;font-weight:700;display:flex;align-items:center;gap:5px;box-shadow:0 2px 10px rgba(0,20,80,0.08),inset 0 1px 0 rgba(255,255,255,0.9)}
.pill span{color:var(--blue2);font-weight:800;font-size:15px}
.pill.bank-pill{background:rgba(240,235,255,0.7);border-color:rgba(180,140,255,0.4)}
.pill.bank-pill span{color:#6020cc}

/* ── PODIUM ── */
.podium-bar{position:relative;z-index:9;padding:10px 36px 12px;background:rgba(255,255,255,0.75);backdrop-filter:blur(24px) saturate(160%);border-bottom:1.5px solid rgba(255,255,255,0.5);box-shadow:0 4px 20px rgba(0,20,80,0.08),inset 0 1px 0 rgba(255,255,255,0.9)}
.podium-label{font-size:14px;letter-spacing:4px;color:#000000;text-align:center;margin-bottom:8px;text-transform:uppercase;font-weight:700}
.podium-grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;max-width:1100px;margin:0 auto;align-items:end}
.pod{border-radius:22px;text-align:center;position:relative;overflow:hidden;padding:10px 8px;backdrop-filter:blur(20px) saturate(180%)}
.pod::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;border-radius:22px 22px 0 0;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0) 100%);pointer-events:none;z-index:1}
.pod.p1{background:linear-gradient(160deg,rgb(255, 221, 0),rgba(255,200,40,0.3),rgba(200,150,0,0.15));border:1.5px solid rgba(255,220,60,0.65);box-shadow:0 10px 36px rgba(180,140,0,0.22),inset 0 1.5px 0 rgba(255,255,255,0.85);padding:16px 8px}
.pod.p2{background:linear-gradient(160deg,rgb(0, 136, 255),rgba(100,180,255,0.25),rgba(0,100,220,0.1));border:1.5px solid rgba(120,190,255,0.6);box-shadow:0 6px 28px rgba(0,80,200,0.18),inset 0 1.5px 0 rgba(255,255,255,0.8)}
.pod.p3{background:linear-gradient(160deg,rgb(0, 136, 255),rgba(100,180,255,0.25),rgba(0,100,220,0.1));border:1.5px solid rgba(120,190,255,0.6);box-shadow:0 6px 28px rgba(0,80,200,0.18),inset 0 1.5px 0 rgba(255,255,255,0.8)}
.pod-medal{font-size:26px;display:block;margin-bottom:5px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));position:relative;z-index:2}
.pod-photo-wrap{position:relative;display:inline-block;margin:0 auto 7px;z-index:2}
.pod-photo{border-radius:50%;object-fit:cover;display:block;box-shadow:0 6px 22px rgba(0,0,0,0.2)}
.pod-photo-ph{border-radius:50%;background:rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.pod-ring{position:absolute;inset:-5px;border-radius:50%;border:2.5px solid transparent;animation:spinRing 3.5s linear infinite;z-index:0}
.p1 .pod-photo,.p1 .pod-photo-ph{border:4px solid rgb(255, 200, 0)}
.p2 .pod-photo,.p2 .pod-photo-ph{border:4px solid rgb(0, 132, 255)}
.p3 .pod-photo,.p3 .pod-photo-ph{border:4px solid rgb(0, 132, 255)}
.p1 .pod-ring{border-top-color:rgb(0, 0, 0);border-right-color:rgb(253, 198, 0)}
.p2 .pod-ring{border-top-color:rgb(0, 0, 0);border-right-color:rgb(0, 132, 255)}
.p3 .pod-ring{border-top-color:rgb(0, 0, 0);border-right-color:rgb(0, 132, 255)}
@keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.pod-lbl{font-size:9px;letter-spacing:2px;color:#000000;text-transform:uppercase;font-weight:700;margin-bottom:2px;position:relative;z-index:2}
.pod-name{font-family:'Cairo',sans-serif;font-weight:900;direction:rtl;margin-bottom:3px;position:relative;z-index:2}
.p1 .pod-name{color:#000000;font-size:18px} .p2 .pod-name{color:#000000;font-size:15px} .p3 .pod-name{color:#000000;font-size:15px}
.pod-earn{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:800;position:relative;z-index:2}
.p1 .pod-earn{color:#000000} .p2 .pod-earn{color:#000000} .p3 .pod-earn{color:#000000}

/* ── SCROLL AREA ── */
.slide-area{position:fixed;left:0;right:0;overflow:hidden;z-index:5}
.list-inner{
  display:flex;flex-direction:column;gap:12px;
  padding:14px 44px;
  animation:scrollUp linear infinite;
}
@keyframes scrollUp{
  0%{transform:translateY(0)}
  100%{transform:translateY(-50%)}
}

/* ── EMPLOYEE CARD ── */
.emp-card{
  border-radius:18px;padding:0 28px;
  display:flex;align-items:center;gap:20px;
  position:relative;overflow:hidden;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 4px 20px rgba(0,20,80,0.10),inset 0 1.5px 0 rgba(255,255,255,0.85);
}
/* top shine */
.emp-card::after{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),transparent)}
/* left strip */
.emp-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:18px 0 0 18px}

/* ── COLOUR TIERS ── */
/* Red < 25000 */
.emp-card.tier-red{background:linear-gradient(135deg,rgba(255,60,60,0.14),rgba(255,255,255,0.7));border:1.5px solid var(--c-red-border)}
.emp-card.tier-red::before{background:linear-gradient(180deg,#ff4444,#ff8888)}
.emp-card.tier-red .rname{color:#cc0000}
.emp-card.tier-red .rearn{color:#cc0000}
.emp-card.tier-red .rbar{background:linear-gradient(90deg,#ff4444,#ff9999)}

/* Yellow 25000-49999 */
.emp-card.tier-yellow{background:linear-gradient(135deg,rgba(255,200,0,0.14),rgba(255,255,255,0.7));border:1.5px solid var(--c-yellow-border)}
.emp-card.tier-yellow::before{background:linear-gradient(180deg,#e6a800,#ffd700)}
.emp-card.tier-yellow .rname{color:#8a5e00}
.emp-card.tier-yellow .rearn{color:#8a5e00}
.emp-card.tier-yellow .rbar{background:linear-gradient(90deg,#e6a800,#ffd700)}

/* Light green 50000-99999 */
.emp-card.tier-lgreen{background:linear-gradient(135deg,rgba(34,197,94,0.13),rgba(255,255,255,0.7));border:1.5px solid var(--c-lgreen-border)}
.emp-card.tier-lgreen::before{background:linear-gradient(180deg,#22c55e,#86efac)}
.emp-card.tier-lgreen .rname{color:#22a153}
.emp-card.tier-lgreen .rearn{color:#22a153}
.emp-card.tier-lgreen .rbar{background:linear-gradient(90deg,#22c55e,#86efac)}

/* Green 100000+ */
.emp-card.tier-green{background:linear-gradient(135deg,rgba(22,163,74,0.15),rgba(255,255,255,0.7));border:1.5px solid var(--c-green-border)}
.emp-card.tier-green::before{background:linear-gradient(180deg,#169c47,#4ade80)}
.emp-card.tier-green .rname{color:#14532d}
.emp-card.tier-green .rearn{color:#14532d}
.emp-card.tier-green .rbar{background:linear-gradient(90deg,#16a34a,#4ade80)}

/* Zero earners */
.emp-card.tier-zero{background:linear-gradient(135deg,rgba(255,60,60,0.14),rgba(255,255,255,0.7));border:1.5px solid var(--c-red-border)}
.emp-card.tier-zero::before{background:linear-gradient(180deg,#aab4c8,#ccd4e0)}
.emp-card.tier-zero .rname{color:#cc0000}
.emp-card.tier-zero .rearn{color:#cc0000}
.emp-card.tier-zero .rbar{background:linear-gradient(90deg,#ff4444,#ff9999)}

.rank-badge{font-family:'Rajdhani',sans-serif;font-weight:800;min-width:64px;text-align:center;color:#b0c4d8;line-height:1}
.rank-badge.gold{color:#c8980a}
.rank-badge.silver{color:#6a82a8}
.rank-badge.bronze{color:#a05020}

.emp-photo{border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid rgba(255,255,255,0.85);box-shadow:0 4px 14px rgba(0,0,0,0.15)}
.emp-photo-placeholder{border-radius:50%;background:rgba(200,215,240,0.5);border:3px solid rgba(255,255,255,0.7);flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,0.1)}

.emp-info{flex:1;min-width:0}
.rname{font-family:'Cairo',sans-serif;font-weight:900;direction:rtl;color:var(--blue2);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.rearn{font-family:'Rajdhani',sans-serif;font-weight:800;min-width:180px;text-align:right;color:var(--blue2)}
.rbar-wrap{width:200px;height:7px;background:rgba(0,82,155,0.1);border-radius:99px;overflow:hidden}
.rbar{height:100%;border-radius:99px}
.medal-icon{font-size:22px}

.rearn,.pod-earn,.titem b{direction:ltr;unicode-bidi:isolate}

/* ── FOOTER ── */
.footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#00529b 0%,#003f7a 50%,#00529b 100%);border-top:2px solid var(--gold);padding:9px 0;overflow:hidden;z-index:20;box-shadow:0 -4px 20px rgba(0,30,80,0.2)}
.ticker-track{display:flex;gap:0;white-space:nowrap;animation:ticker 30s linear infinite}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.titem{font-size:18px;color:rgba(255,255,255,0.9);flex-shrink:0;font-family:'Cairo',sans-serif;padding:0 30px;border-right:1px solid rgba(255,255,255,0.15);display:inline-flex;align-items:center;gap:10px}
.titem b{color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:800;text-shadow:0 0 10px rgba(245,200,66,0.5)}
.titem .tidot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;box-shadow:0 0 8px rgba(245,200,66,0.6)}
</style>
</head>

  ar:{title:'🏆 لوحة المتصدرين',employees:'الموظفون',teamTotal:'إجمالي الفريق',bankTotal:'إجمالي البنك',
    monthlyEarnings:'أرباح الشهر',place1:'المركز الأول',place2:'المركز الثاني',place3:'المركز الثالث',
    topPerformers:'✨ أفضل الموظفين',currency:' ريال',zero:'٠ ريال',dir:'rtl'}
};
let currentLang='en';
function T(){return LANG[currentLang];}

// Riyal symbol is drawn by CSS (.sar) and always placed BEFORE the amount
const RIYAL = '<span class="sar"></span>';
function fmtL(n){ return RIYAL + (n===0 ? '0' : n.toLocaleString('en-US')); }

function displayName(n){return(currentLang==='en'&&engNameMap[n])?engNameMap[n]:n;}

let DATA=[], photoMap={}, engNameMap={}, currentSettings={}, currentAllEmployees=[], isPaused=false;
const SPECIAL_NAMES=['غلا ال حزام','مي سعيد','محمد الحلياني','هدى الجلعود', 'استقطاب المركز'];
const PER_PAGE = 5;
let currentPage = 0, totalPages = 0, slideTimer = null;

function getTier(total){
  if(total === 0) return 'tier-zero';
  if(total < 25000) return 'tier-red';
  if(total < 50000) return 'tier-yellow';
  if(total < 100000) return 'tier-lgreen';
  return 'tier-green';
}

function getRankClass(r){return r===1?'top1':r===2?'top2':r===3?'top3':'';}

function getRankBadge(r){return r===1?'gold':r===2?'silver':r===3?'bronze':'';}
function getMedal(r){return r===1?'🥇':r===2?'🥈':r===3?'🥉':'';}

function buildSlides(){
  const area = document.getElementById('slide-area');
  const li = document.getElementById('list-inner');
  const maxE = DATA[0] ? DATA[0].total : 1;
  const headerH = document.querySelector('.header').offsetHeight;
  const podiumH = document.getElementById('podium-bar').offsetHeight;
  const footerH = document.querySelector('.footer').offsetHeight + 44;
  const availH = window.innerHeight - headerH - podiumH - footerH - 20;
  const cardH = Math.floor(availH / PER_PAGE) - 12;
  const photoSz = Math.min(Math.floor(cardH * 0.78), 110);
  const nameFz = Math.min(Math.floor(cardH * 0.46), 58);
  const earnFz = Math.min(Math.floor(cardH * 0.42), 50);
  const rankFz = Math.min(Math.floor(cardH * 0.52), 60);

  area.style.top = (headerH + podiumH) + 'px';
  area.style.bottom = (document.querySelector('.footer').offsetHeight + 8) + 'px';

  function makeRows(){
    return DATA.map((e, i) => {
      const rank = i + 1;
      const tier = getTier(e.total);
      const pct = maxE > 0 ? Math.round(e.total / maxE * 100) : 0;
      const photo = photoMap[e.name];
      const medal = getMedal(rank);
      const card = document.createElement('div');
      card.className = 'emp-card ' + tier;
      card.style.cssText = 'min-height:' + cardH + 'px;padding:0 28px;flex-shrink:0';
      card.innerHTML = `
        <div class="rank-badge ${getRankBadge(rank)}" style="font-size:${rankFz}px;min-width:${rankFz+14}px">${rank}</div>
        ${photo
          ? `<img class="emp-photo" src="${photo}" style="width:${photoSz}px;height:${photoSz}px"/>`
          : `<div class="emp-photo-placeholder" style="width:${photoSz}px;height:${photoSz}px;font-size:${Math.floor(photoSz*0.4)}px">👤</div>`
        }
        <div class="emp-info">
          <div class="rname" style="font-size:${nameFz}px">${displayName(e.name)}</div>
        </div>
        <div class="emp-right">
          <div style="display:flex;align-items:center;gap:8px">
            ${medal ? `<span class="medal-icon">${medal}</span>` : ''}
            <div class="rearn" style="font-size:${earnFz}px">${fmtL(e.total)}</div>
          </div>
          <div class="rbar-wrap"><div class="rbar" style="width:${pct}%"></div></div>
        </div>`;
      return card;
    });
  }

  li.innerHTML = '';
  const rows1 = makeRows();
  const rows2 = makeRows();
  rows1.forEach(c => li.appendChild(c));
  rows2.forEach(c => li.appendChild(c));

  // Set scroll speed based on content height
  const totalH = li.scrollHeight / 2;
  const speed = Math.max(10, totalH / 80);
  li.style.animationDuration = speed + 's';
  li.style.animationPlayState = isPaused ? 'paused' : 'running';
}

function startSlideshow(){
  buildSlides();
}
const COLORS=['#0066cc','#e3231c','#34a853','#7b2d8b','#0288d1','#f57c00','#00796b','#558b2f','#c62828','#6a1f96'];

setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB');},1000);

function renderPodium(){
  const t=T();
  const top3=DATA.slice(0,3);
  const order=[top3[1],top3[0],top3[2]];
  const medals=['🥈','🥇','🥉'];
  const pcls=['p2','p1','p3'];
  const plbls=[t.place2,t.place1,t.place3];
  const sizes=[110,150,110];
  document.getElementById('podium-label').textContent=t.topPerformers;
  document.getElementById('podium-grid').innerHTML=order.map((e,i)=>{
    if(!e) return '<div></div>';
    const sz=sizes[i];
    const photo=photoMap[e.name];
    return `<div class="pod ${pcls[i]}">
      <span class="pod-medal">${medals[i]}</span>
      <div class="pod-photo-wrap">
        ${photo?`<img class="pod-photo" src="${photo}" style="width:${sz}px;height:${sz}px"/>`
               :`<div class="pod-photo-ph" style="width:${sz}px;height:${sz}px;font-size:${Math.floor(sz*0.4)}px">👤</div>`}
        <div class="pod-ring"></div>
      </div>
      <div class="pod-lbl">${plbls[i]}</div>
      <div class="pod-name">${displayName(e.name)}</div>
      <div class="pod-earn">${fmtL(e.total)}</div>
    </div>`;
  }).join('');
}

function renderAll(employees, settings){
  const allEmployees = employees.slice();
  currentAllEmployees = allEmployees;
  DATA = allEmployees.filter(e => !SPECIAL_NAMES.includes(e.name.trim()));
  currentSettings = settings;
  const t = T();

  document.getElementById('emp-count').textContent = settings.totalEmployees || allEmployees.length;
  const grandTotal = settings.teamTotalOverride && settings.teamTotalOverride > 0
    ? Number(settings.teamTotalOverride)
    : allEmployees.reduce((s,e)=>s+e.total,0);
  document.getElementById('ttotal').innerHTML = RIYAL + grandTotal.toLocaleString('en-US');

  const bval = settings.bankTotal ? Number(settings.bankTotal) : 0;
  document.getElementById('banktotal').innerHTML = bval>0 ? RIYAL + bval.toLocaleString('en-US') : '--';
  document.getElementById('lbl-banktotal').textContent = t.bankTotal+':';

  if(settings.month||settings.year)
    document.getElementById('header-sub').textContent=(settings.month||'')+' '+(settings.year||'');

  // Ticker — only special people
  const specialEmps = allEmployees.filter(e => SPECIAL_NAMES.includes(e.name.trim()));
  const tHTML = specialEmps.map(e=>
    `<span class="titem"><span class="tidot"></span>${e.name}&nbsp;<b>${fmtL(e.total)}</b></span>`
  ).join('');
  document.getElementById('ticker').innerHTML = tHTML + tHTML;

  renderPodium();
  if(slideTimer) clearInterval(slideTimer);
  setTimeout(() => { buildSlides(); startSlideshow(); }, 200);
}

function applyLang(){
  const t=T();
  document.documentElement.setAttribute('dir',t.dir);
  document.getElementById('main-title').textContent=t.title;
  document.getElementById('lbl-employees').textContent=t.employees+':';
  document.getElementById('lbl-teamtotal').textContent=t.teamTotal+':';
  document.getElementById('lbl-banktotal').textContent=t.bankTotal+':';
  if(DATA.length>0) renderAll(currentAllEmployees, currentSettings);
}

// Firestore listeners
db.collection('leaderboard').doc('photos').onSnapshot(doc=>{
  photoMap = doc.exists?(doc.data().photos||{}):{};
  engNameMap = doc.exists?(doc.data().engNames||{}):{};
  if(DATA.length>0){ renderPodium(); buildSlides(); }
});

db.collection('leaderboard').doc('current').onSnapshot(doc=>{
  if(doc.exists){
    const d=doc.data();
    renderAll((d.employees||[]).sort((a,b)=>b.total-a.total), d.settings||{});
  }
});

db.collection('leaderboard').doc('control').onSnapshot(doc=>{
  if(doc.exists){
    const d=doc.data();
    isPaused = d.scroll==='pause';
    const li = document.getElementById('list-inner');
    if(li) li.style.animationPlayState = isPaused ? 'paused' : 'running';
    const lang=d.lang||'en';
    if(lang!==currentLang){currentLang=lang;applyLang();}
  }
});

window.addEventListener('resize', buildSlides);
setInterval(()=>{const n=new Date();if(n.getHours()===0&&n.getMinutes()===0)location.reload();},60000);

</script>
</body>
